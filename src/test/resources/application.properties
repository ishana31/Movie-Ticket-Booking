spring.application.name=MovieMatic-Test

# In-memory H2 configuration for tests
spring.datasource.url=jdbc:h2:mem:moviematictest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable real mail in tests
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@moviematic.com
spring.mail.password=test

# Razorpay dummy test keys
razorpay.key_id=rzp_test_testkey
razorpay.key_secret=testsecret
